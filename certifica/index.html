<style>
  :root{
    --bg:#F4F6FA;
    --surface:#FFFFFF;
    --surface-2:#E9EDF5;
    --border:#D7DEEA;
    --ink:#1B2340;
    --ink-soft:#5B6584;
    --ink-faint:#98A2BE;
    --accent:#2F5FE0;
    --accent-soft:rgba(47,95,224,0.10);
    --gold:#E0A72F;
    --ok:#2E9E64;
    --ok-soft:rgba(46,158,100,0.12);
    --err:#D8483F;
    --err-soft:rgba(216,72,63,0.10);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    overflow:hidden;
  }
  h1,h2,h3{ font-family:'Space Grotesk',sans-serif; margin:0; }
  ::selection{ background:var(--accent-soft); }
  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }

  /* ---------- Login ---------- */
  .login-screen{
    width:100%; min-height:100vh; display:none;
    align-items:center; justify-content:center; padding:20px;
  }
  .login-card{
    background:var(--surface); border:1px solid var(--border); border-radius:18px;
    padding:44px 36px; width:360px; max-width:90vw; text-align:center;
    box-shadow:0 16px 40px rgba(27,35,64,0.08);
  }
  .login-badge{
    width:56px; height:56px; border-radius:16px; background:var(--accent-soft);

<script>
/* ---------- Firebase (mesmo projeto do hub / planeador de viagem) ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyAE2W69g2EMObYj4dztEDIMYO82KaLIpSA",
  authDomain: "planeador-viagem.firebaseapp.com",
  projectId: "planeador-viagem",
  storageBucket: "planeador-viagem.firebasestorage.app",
  messagingSenderId: "901648697808",
  appId: "1:901648697808:web:6e76ed1a9c9ff84db2d1d5"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
let modules = [];
let modulesUnsub = null;
let currentModuleId = null;
let questions = [];
let questionsUnsub = null;
let progress = { currentIndex: 0, answers: {} };
let progressUnsub = null;
let editingQuestionId = null;
let optionCount = 0;
let pendingPhoto = null;
let photoRemoved = false;
let answeredThisQuestion = false;

function uid(){ return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function escapeHtml(str){
  return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------- Tema ---------- */
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  try{ localStorage.setItem('cert-theme', theme); }catch(e){}
  document.getElementById('themeToggleBtn').textContent = theme === 'dark' ? '☀️' : '🌙';
}
function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem('cert-theme'); }catch(e){}
  applyTheme(saved || 'light');
}
document.getElementById('themeToggleBtn').addEventListener('click', ()=>{
  applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});

/* ---------- Login / Auth ---------- */
function showLogin(){
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('appShell').style.display = 'none';
}
function showApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appShell').style.display = 'flex';
}
function attemptSignIn(){
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(err=>{
    console.error('Erro no login', err);
    errEl.style.display = 'block';
  });
}
document.getElementById('googleSignInBtn').addEventListener('click', attemptSignIn);
document.getElementById('signOutBtn').addEventListener('click', ()=> auth.signOut());

function renderAccountUser(){
  const el = document.getElementById('accountUser');
  if(!currentUser){ el.innerHTML = ''; return; }
  el.innerHTML = `
    ${currentUser.photoURL ? `<img src="${currentUser.photoURL}" alt="">` : ''}
    <span>${escapeHtml(currentUser.displayName || currentUser.email || '')}</span>
  `;
}

/* ---------- Compressão de imagem ---------- */
function compressImageToDataUrl(file, maxDim = 900, quality = 0.65){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > height && width > maxDim){ height = Math.round(height * maxDim / width); width = maxDim; }
        else if(height >= width && height > maxDim){ width = Math.round(width * maxDim / height); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------- Módulos ---------- */
function loadModules(){
  if(modulesUnsub) modulesUnsub();
  modulesUnsub = db.collection('quizModules').orderBy('createdAt', 'asc').onSnapshot(snap=>{
    modules = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    renderModuleGrid();
  }, err=>console.error('Erro a carregar módulos', err));
}

async function computeModuleProgress(moduleId){
  try{
    const qSnap = await db.collection('quizModules').doc(moduleId).collection('questions').get();
    const total = qSnap.size;
    if(total === 0) return { total: 0, answered: 0 };
    const pDoc = await db.collection('quizProgress').doc(currentUser.uid).collection('modules').doc(moduleId).get();
    const answered = pDoc.exists ? Object.keys(pDoc.data().answers || {}).length : 0;
    return { total, answered };
  }catch(e){
    return { total: 0, answered: 0 };
  }
}

async function renderModuleGrid(){
  const grid = document.getElementById('moduleGrid');
  if(modules.length === 0){
    grid.innerHTML = `<div class="empty-state">Ainda não criaste nenhum módulo.<span>Usa "+ Novo módulo" para começar (ex: AZ-104, MD-102, VMCE).</span></div>`;
    return;
  }
  grid.innerHTML = modules.map(m => `
    <div class="module-card" data-id="${m.id}">
      <button class="module-delete" data-action="delete-module" data-id="${m.id}" title="Eliminar módulo">✕</button>
      <span class="module-code">${escapeHtml(m.code)}</span>
      <div class="module-name">${escapeHtml(m.name || m.code)}</div>
      <div class="module-meta" data-meta="${m.id}">a carregar…</div>
      <div class="module-progress-bar"><div class="module-progress-fill" data-fill="${m.id}" style="width:0%"></div></div>
    </div>
  `).join('');

  grid.querySelectorAll('.module-card').forEach(card=>{
    card.addEventListener('click', (e)=>{
      if(e.target.closest('[data-action="delete-module"]')) return;
      openModule(card.dataset.id);
    });
  });
  grid.querySelectorAll('[data-action="delete-module"]').forEach(btn=>{
    btn.addEventListener('click', ()=> confirmDeleteModule(btn.dataset.id));
  });

  modules.forEach(async m=>{
    const { total, answered } = await computeModuleProgress(m.id);
    const metaEl = grid.querySelector(`[data-meta="${m.id}"]`);
    const fillEl = grid.querySelector(`[data-fill="${m.id}"]`);
    if(!metaEl) return;
    metaEl.textContent = total === 0 ? 'Sem perguntas ainda' : `${answered} / ${total} respondidas`;
    if(fillEl) fillEl.style.width = total > 0 ? Math.round(answered / total * 100) + '%' : '0%';
  });
}

document.getElementById('newModuleBtn').addEventListener('click', ()=>{
  document.getElementById('moduleCodeInput').value = '';
  document.getElementById('moduleNameInput').value = '';
  document.getElementById('moduleModalOverlay').classList.add('open');
  document.getElementById('moduleCodeInput').focus();
});
document.getElementById('moduleCancelBtn').addEventListener('click', ()=>{
  document.getElementById('moduleModalOverlay').classList.remove('open');
});
document.getElementById('moduleModalOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'moduleModalOverlay') document.getElementById('moduleModalOverlay').classList.remove('open');
});
document.getElementById('moduleSaveBtn').addEventListener('click', async ()=>{
  const code = document.getElementById('moduleCodeInput').value.trim();
  const name = document.getElementById('moduleNameInput').value.trim();
  if(!code) { alert('Escreve pelo menos o código do módulo (ex: AZ-104).'); return; }
  try{
    await db.collection('quizModules').add({ code, name, createdAt: Date.now() });
    document.getElementById('moduleModalOverlay').classList.remove('open');
  }catch(e){ console.error(e); alert('Não foi possível criar o módulo.'); }
});

function confirmDeleteModule(moduleId){
  openConfirm('Eliminar módulo?', 'Isto remove o módulo e todas as suas perguntas. Não pode ser desfeito.', async ()=>{
    try{
      const qSnap = await db.collection('quizModules').doc(moduleId).collection('questions').get();
      const batch = db.batch();
      qSnap.docs.forEach(d => batch.delete(d.ref));
      batch.delete(db.collection('quizModules').doc(moduleId));
      await batch.commit();
      db.collection('quizProgress').doc(currentUser.uid).collection('modules').doc(moduleId).delete().catch(()=>{});
    }catch(e){ console.error(e); alert('Não foi possível eliminar o módulo.'); }
  });
}
document.getElementById('deleteModuleBtn').addEventListener('click', ()=>{
  if(!currentModuleId) return;
  const m = modules.find(x => x.id === currentModuleId);
  openConfirm('Eliminar módulo?', `Isto remove "${m ? m.code : ''}" e todas as suas perguntas. Não pode ser desfeito.`, async ()=>{
    await confirmDeleteModuleAction(currentModuleId);
    goToModules();
  });
});
async function confirmDeleteModuleAction(moduleId){
  try{
    const qSnap = await db.collection('quizModules').doc(moduleId).collection('questions').get();
    const batch = db.batch();
    qSnap.docs.forEach(d => batch.delete(d.ref));
    batch.delete(db.collection('quizModules').doc(moduleId));
    await batch.commit();
    db.collection('quizProgress').doc(currentUser.uid).collection('modules').doc(moduleId).delete().catch(()=>{});
  }catch(e){ console.error(e); alert('Não foi possível eliminar o módulo.'); }
}

/* ---------- Confirmação genérica ---------- */
let confirmCallback = null;
function openConfirm(title, body, onConfirm){
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmBody').textContent = body;
  confirmCallback = onConfirm;
  document.getElementById('confirmOverlay').classList.add('open');
}
document.getElementById('confirmCancelBtn').addEventListener('click', ()=>{
  document.getElementById('confirmOverlay').classList.remove('open');
  confirmCallback = null;
});
document.getElementById('confirmOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'confirmOverlay'){ document.getElementById('confirmOverlay').classList.remove('open'); confirmCallback = null; }
});
document.getElementById('confirmOkBtn').addEventListener('click', async ()=>{
  const cb = confirmCallback;
  document.getElementById('confirmOverlay').classList.remove('open');
  confirmCallback = null;
  if(cb) await cb();
});

/* ---------- Navegação módulo ---------- */
function goToModules(){
  currentModuleId = null;
  if(questionsUnsub){ questionsUnsub(); questionsUnsub = null; }
  if(progressUnsub){ progressUnsub(); progressUnsub = null; }
  document.getElementById('modulePage').style.display = 'none';
  document.getElementById('modulesPage').style.display = 'block';
  renderModuleGrid();
}
document.getElementById('backToModulesBtn').addEventListener('click', goToModules);

function openModule(moduleId){
  currentModuleId = moduleId;
  const m = modules.find(x => x.id === moduleId);
  document.getElementById('moduleTitle').textContent = m ? (m.name ? `${m.code} — ${m.name}` : m.code) : '';
  document.getElementById('modulesPage').style.display = 'none';
  document.getElementById('modulePage').style.display = 'block';
  switchSubtab('study');

  if(questionsUnsub) questionsUnsub();
  questionsUnsub = db.collection('quizModules').doc(moduleId).collection('questions').orderBy('createdAt', 'asc').onSnapshot(snap=>{
    questions = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    renderQuestionList();
    renderStudy();
  }, err=>console.error('Erro a carregar perguntas', err));

  if(progressUnsub) progressUnsub();
  progressUnsub = db.collection('quizProgress').doc(currentUser.uid).collection('modules').doc(moduleId).onSnapshot(doc=>{
    progress = doc.exists ? Object.assign({ currentIndex:0, answers:{} }, doc.data()) : { currentIndex:0, answers:{} };
    renderStudy();
  }, err=>console.error('Erro a carregar progresso', err));
}

document.querySelectorAll('.subtab').forEach(btn=>{
  btn.addEventListener('click', ()=> switchSubtab(btn.dataset.subtab));
});
function switchSubtab(name){
  document.querySelectorAll('.subtab').forEach(b => b.classList.toggle('active', b.dataset.subtab === name));
  document.getElementById('studyTab').style.display = name === 'study' ? 'block' : 'none';
  document.getElementById('manageTab').style.display = name === 'manage' ? 'block' : 'none';
}

function saveProgress(){
  if(!currentModuleId || !currentUser) return;
  db.collection('quizProgress').doc(currentUser.uid).collection('modules').doc(currentModuleId)
    .set({ currentIndex: progress.currentIndex, answers: progress.answers, updatedAt: Date.now() }, { merge:true })
    .catch(e => console.error('Erro a guardar progresso', e));
}

/* ---------- Estudar ---------- */
function renderStudy(){
  const wrap = document.getElementById('studyWrap');
  if(wrap) buildStudyHtml(wrap);
}

function buildStudyHtml(wrap){
  if(questions.length === 0){
    wrap.innerHTML = `<div class="empty-state">Este módulo ainda não tem perguntas.<span>Vai a "Perguntas" para adicionares a primeira.</span></div>`;
    return;
  }
  if(progress.currentIndex >= questions.length) progress.currentIndex = questions.length - 1;
  if(progress.currentIndex < 0) progress.currentIndex = 0;

  const idx = progress.currentIndex;
  const q = questions[idx];
  const savedAnswer = progress.answers && progress.answers[q.id];
  answeredThisQuestion = savedAnswer !== undefined;

  const correctCount = Object.keys(progress.answers || {}).filter(qid=>{
    const qq = questions.find(x => x.id === qid);
    return qq && progress.answers[qid] === qq.correctIndex;
  }).length;
  const answeredCount = Object.keys(progress.answers || {}).length;

  wrap.innerHTML = `
    <div class="study-progress">
      <span>Pergunta ${idx + 1} de ${questions.length}</span>
      <span class="score-pill">✓ ${correctCount} / ${answeredCount} respondidas</span>
    </div>
    <div class="study-progress-bar"><div class="study-progress-fill" style="width:${Math.round((idx) / questions.length * 100)}%"></div></div>
    <div class="question-card">
      ${q.image ? `<img src="${q.image}" class="question-image" alt="">` : ''}
      <div class="question-text">${escapeHtml(q.text)}</div>
      <div id="optionsWrap">${(q.options || []).map((opt, i) => optionRowHtml(opt, i, savedAnswer, q.correctIndex)).join('')}</div>
      ${answeredThisQuestion && q.explanation ? `<div class="explanation-box"><strong>Porquê:</strong> ${escapeHtml(q.explanation)}</div>` : ''}
    </div>
    <div class="study-actions">
      <button class="btn-secondary" id="prevQBtn" ${idx === 0 ? 'disabled' : ''}>← Anterior</button>
      <button class="btn-secondary" id="resetProgressBtn">Recomeçar módulo</button>
      <button class="btn-primary" id="nextQBtn" ${idx === questions.length - 1 ? 'disabled' : ''}>Seguinte →</button>
    </div>
  `;

  if(!answeredThisQuestion){
    wrap.querySelectorAll('.option-row').forEach(row=>{
      row.addEventListener('click', ()=>{
        const chosen = parseInt(row.dataset.index, 10);
        progress.answers = progress.answers || {};
        progress.answers[q.id] = chosen;
        saveProgress();
        renderStudy();
      });
    });
  }

  document.getElementById('prevQBtn').addEventListener('click', ()=>{
    progress.currentIndex = Math.max(0, progress.currentIndex - 1);
    saveProgress();
    renderStudy();
  });
  document.getElementById('nextQBtn').addEventListener('click', ()=>{
    progress.currentIndex = Math.min(questions.length - 1, progress.currentIndex + 1);
    saveProgress();
    renderStudy();
  });
  document.getElementById('resetProgressBtn').addEventListener('click', ()=>{
    openConfirm('Recomeçar módulo?', 'Isto apaga as tuas respostas guardadas neste módulo e volta à primeira pergunta.', ()=>{
      progress = { currentIndex: 0, answers: {} };
      saveProgress();
      renderStudy();
    });
  });
}

function optionRowHtml(text, index, savedAnswer, correctIndex){
  const letter = String.fromCharCode(65 + index);
  let cls = 'option-row';
  if(savedAnswer !== undefined){
    cls += ' disabled';
    if(index === correctIndex) cls += ' correct';
    else if(index === savedAnswer) cls += ' incorrect';
  }
  return `
    <div class="${cls}" data-index="${index}">
      <span class="option-letter">${letter}</span>
      <span>${escapeHtml(text)}</span>
    </div>
  `;
}

/* ---------- Gerir perguntas ---------- */
function renderQuestionList(){
  const root = document.getElementById('questionList');
  if(questions.length === 0){
    root.innerHTML = `<div class="empty-state">Ainda não há perguntas neste módulo.</div>`;
    return;
  }
  root.innerHTML = questions.map((q, i) => `
    <div class="q-list-row">
      ${q.image ? `<img src="${q.image}" class="q-list-thumb">` : ''}
      <div class="q-list-body">
        <div class="q-list-text">${i + 1}. ${escapeHtml(q.text)}</div>
        <div class="q-list-meta">${(q.options || []).length} opções · correta: ${String.fromCharCode(65 + (q.correctIndex || 0))}</div>
      </div>
      <div class="q-list-actions">
        <button class="icon-btn" title="Editar" data-action="edit-q" data-id="${q.id}">✎</button>
        <button class="icon-btn" title="Remover" data-action="delete-q" data-id="${q.id}">✕</button>
      </div>
    </div>
  `).join('');
  root.querySelectorAll('[data-action="edit-q"]').forEach(btn=>{
    btn.addEventListener('click', ()=> openQuestionModal(btn.dataset.id));
  });
  root.querySelectorAll('[data-action="delete-q"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      openConfirm('Remover pergunta?', 'Esta ação não pode ser desfeita.', async ()=>{
        try{ await db.collection('quizModules').doc(currentModuleId).collection('questions').doc(btn.dataset.id).delete(); }
        catch(e){ console.error(e); alert('Não foi possível remover.'); }
      });
    });
  });
}

document.getElementById('newQuestionBtn').addEventListener('click', ()=> openQuestionModal(null));

function addOptionRow(value, checked){
  optionCount++;
  const id = 'opt_' + optionCount;
  const list = document.getElementById('optionsEditList');
  const row = document.createElement('div');
  row.className = 'option-edit-row';
  row.dataset.optId = id;
  row.innerHTML = `
    <input type="radio" name="correctOption" value="${id}" ${checked ? 'checked' : ''}>
    <input type="text" placeholder="Texto da opção" value="${escapeHtml(value || '')}">
    <button type="button" class="option-remove-btn" title="Remover opção">✕</button>
  `;
  row.querySelector('.option-remove-btn').addEventListener('click', ()=>{
    if(document.querySelectorAll('.option-edit-row').length <= 2) { alert('É preciso pelo menos 2 opções.'); return; }
    row.remove();
  });
  list.appendChild(row);
}
document.getElementById('addOptionBtn').addEventListener('click', ()=>{
  if(document.querySelectorAll('.option-edit-row').length >= 6){ alert('Máximo de 6 opções.'); return; }
  addOptionRow('', false);
});

function openQuestionModal(questionId){
  editingQuestionId = questionId;
  const q = questionId ? questions.find(x => x.id === questionId) : null;
  document.getElementById('questionModalTitle').textContent = q ? 'Editar pergunta' : 'Nova pergunta';
  document.getElementById('qTextInput').value = q ? q.text : '';
  document.getElementById('qExplanationInput').value = q ? (q.explanation || '') : '';
  document.getElementById('qDeleteBtn').style.display = q ? 'block' : 'none';

  pendingPhoto = q ? (q.image || null) : null;
  photoRemoved = false;
  const previewWrap = document.getElementById('qPhotoPreviewWrap');
  previewWrap.innerHTML = pendingPhoto ? `<img src="${pendingPhoto}" class="photo-preview">` : '';
  document.getElementById('qRemovePhotoBtn').style.display = pendingPhoto ? 'inline-block' : 'none';
  document.getElementById('qPhotoInput').value = '';

  document.getElementById('optionsEditList').innerHTML = '';
  optionCount = 0;
  const opts = q ? q.options : ['', '', '', ''];
  const correctIdx = q ? q.correctIndex : 0;
  opts.forEach((opt, i) => addOptionRow(opt, i === correctIdx));

  document.getElementById('questionModalOverlay').classList.add('open');
}

async function applyNewQuestionPhoto(file){
  if(!file) return;
  try{
    pendingPhoto = await compressImageToDataUrl(file);
    photoRemoved = false;
    document.getElementById('qPhotoPreviewWrap').innerHTML = `<img src="${pendingPhoto}" class="photo-preview">`;
    document.getElementById('qRemovePhotoBtn').style.display = 'inline-block';
  }catch(e){ console.error(e); alert('Não foi possível processar esta imagem.'); }
}
document.getElementById('qPhotoInput').addEventListener('change', (e)=> applyNewQuestionPhoto(e.target.files[0]));
document.getElementById('qRemovePhotoBtn').addEventListener('click', ()=>{
  pendingPhoto = null;
  photoRemoved = true;
  document.getElementById('qPhotoPreviewWrap').innerHTML = '';
  document.getElementById('qRemovePhotoBtn').style.display = 'none';
});
document.addEventListener('paste', (e)=>{
  if(!document.getElementById('questionModalOverlay').classList.contains('open')) return;
  const items = e.clipboardData && e.clipboardData.items;
  if(!items) return;
  for(const item of items){
    if(item.type && item.type.startsWith('image/')){
      e.preventDefault();
      applyNewQuestionPhoto(item.getAsFile());
      break;
    }
  }
});

document.getElementById('qCancelBtn').addEventListener('click', ()=>{
  document.getElementById('questionModalOverlay').classList.remove('open');
});
document.getElementById('questionModalOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'questionModalOverlay') document.getElementById('questionModalOverlay').classList.remove('open');
});
document.getElementById('qDeleteBtn').addEventListener('click', ()=>{
  document.getElementById('questionModalOverlay').classList.remove('open');
  openConfirm('Remover pergunta?', 'Esta ação não pode ser desfeita.', async ()=>{
    try{ await db.collection('quizModules').doc(currentModuleId).collection('questions').doc(editingQuestionId).delete(); }
    catch(e){ console.error(e); alert('Não foi possível remover.'); }
  });
});

document.getElementById('qSaveBtn').addEventListener('click', async ()=>{
  const text = document.getElementById('qTextInput').value.trim();
  const explanation = document.getElementById('qExplanationInput').value.trim();
  const rows = [...document.querySelectorAll('.option-edit-row')];
  const options = rows.map(r => r.querySelector('input[type="text"]').value.trim());
  const correctRow = rows.findIndex(r => r.querySelector('input[type="radio"]').checked);

  if(!text){ alert('Escreve o texto da pergunta.'); return; }
  if(options.some(o => !o)){ alert('Preenche todas as opções ou remove as vazias.'); return; }
  if(correctRow === -1){ alert('Marca qual é a opção correta.'); return; }

  const image = photoRemoved ? null : pendingPhoto;
  const payload = { text, options, correctIndex: correctRow, explanation, image };

  try{
    if(editingQuestionId){
      await db.collection('quizModules').doc(currentModuleId).collection('questions').doc(editingQuestionId).set(payload, { merge:true });
    } else {
      payload.createdAt = Date.now();
      await db.collection('quizModules').doc(currentModuleId).collection('questions').add(payload);
    }
    document.getElementById('questionModalOverlay').classList.remove('open');
  }catch(e){
    console.error(e);
    alert('Não foi possível guardar a pergunta. Se tiver uma imagem grande, tenta outra mais pequena.');
  }
});

/* ---------- Atalhos de teclado ---------- */
document.addEventListener('keydown', (e)=>{
  const tag = (e.target.tagName || '').toLowerCase();
  const isTyping = tag === 'input' || tag === 'textarea';
  if(e.key === 'Escape'){
    document.querySelectorAll('.overlay.open').forEach(o => o.classList.remove('open'));
    return;
  }
  if(isTyping) return;
  if(document.getElementById('studyTab').style.display !== 'none' && document.getElementById('modulePage').style.display !== 'none'){
    if(e.key === 'ArrowRight'){ document.getElementById('nextQBtn')?.click(); }
    if(e.key === 'ArrowLeft'){ document.getElementById('prevQBtn')?.click(); }
  }
});

/* ---------- Arranque ---------- */
initTheme();
auth.onAuthStateChanged(user=>{
  currentUser = user;
  if(!user){
    if(modulesUnsub){ modulesUnsub(); modulesUnsub = null; }
    if(questionsUnsub){ questionsUnsub(); questionsUnsub = null; }
    if(progressUnsub){ progressUnsub(); progressUnsub = null; }
    showLogin();
    return;
  }
  showApp();
  renderAccountUser();
  goToModules();
  loadModules();
});
</script>
