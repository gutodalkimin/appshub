<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anotações</title>
<meta name="theme-color" content="#C1622D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Anotações">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23C1622D'/%3E%3Crect x='8' y='10' width='16' height='2.6' rx='1.3' fill='%23FFF8F0'/%3E%3Crect x='8' y='15' width='16' height='2.6' rx='1.3' fill='%23FFF8F0' opacity='0.85'/%3E%3Crect x='8' y='20' width='10' height='2.6' rx='1.3' fill='%23FFF8F0' opacity='0.7'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#EFF3F1;
    --surface:#FFFFFF;
    --surface-2:#E4EAE7;
    --border:#D7DDDA;
    --ink:#263238;
    --ink-soft:#5B6B66;
    --ink-faint:#93A29C;
    --accent:#C1622D;
    --accent-soft:rgba(193,98,45,0.12);
    --tag-bg:#DCE6DE;
    --pin:#B08A2E;
    --ok:#4B8B6F;
    --err:#C2483B;
    --radius-card:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    min-height:100vh;
    display:flex;
  }
  ::selection{ background:var(--accent-soft); }
  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:240px;
    flex-shrink:0;
    background:var(--surface);
    border-right:1px solid var(--border);
    padding:26px 18px;
    display:flex;
    flex-direction:column;
    gap:22px;
    height:100vh;
    position:sticky;
    top:0;
  }
  .brand-title{
    font-family:'Newsreader',serif;
    font-weight:700;
    font-size:23px;
    letter-spacing:-0.01em;
  }
  .sync-status{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-faint);
    margin-top:4px;
  }
  .sync-dot{
    width:6px;height:6px;
    border-radius:50%;
    background:var(--ink-faint);
    flex-shrink:0;
  }
  .sync-dot.ok{ background:var(--ok); }
  .sync-dot.err{ background:var(--err); }
  .sync-dot.pending{ background:var(--pin); }

  .search-wrap{ position:relative; }
  .search-input{
    width:100%;
    background:var(--bg);
    border:1px solid var(--border);
    color:var(--ink);
    padding:9px 12px 9px 32px;
    border-radius:9px;
    font-size:13.5px;
    font-family:inherit;
    outline:none;
    transition:border-color .15s ease;
  }
  .search-input:focus{ border-color:var(--accent); }
  .search-icon{
    position:absolute; left:10px; top:50%; transform:translateY(-50%);
    width:14px;height:14px; color:var(--ink-faint);
  }

  .tag-list{
    list-style:none;
    margin:0; padding:0;
    display:flex;
    flex-direction:column;
    gap:2px;
    overflow-y:auto;
  }
  .tag-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:7px 9px;
    border-radius:7px;
    font-size:13.5px;
    color:var(--ink-soft);
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .tag-item:hover{ background:var(--bg); color:var(--ink); }
  .tag-item.active{ background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .tag-count{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint); }
  .tag-item.active .tag-count{ color:var(--accent); }

  .sidebar-footer{
    margin-top:auto;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .user-row{
    display:flex; align-items:center; gap:8px;
    font-size:12.5px; color:var(--ink-soft);
  }
  .user-avatar{ width:24px;height:24px;border-radius:50%; }
  .signout-btn{
    background:none; border:none; color:var(--err);
    font-size:12px; cursor:pointer; padding:0; text-align:left;
    font-family:inherit;
  }

  /* ---------- Main ---------- */
  .main{
    flex:1;
    padding:30px 38px 60px;
    max-width:1080px;
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:28px;
  }
  .topbar h1{
    font-family:'Newsreader',serif;
    font-weight:600;
    font-size:22px;
    margin:0;
  }
  .new-btn{
    background:var(--accent);
    color:#FFF8F0;
    border:none;
    padding:10px 18px;
    border-radius:9px;
    font-family:'Work Sans',sans-serif;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    transition:filter .15s ease, transform .1s ease;
  }
  .new-btn:hover{ filter:brightness(1.08); }
  .new-btn:active{ transform:scale(0.97); }

  .notes-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px,1fr));
    gap:16px;
  }
  .note-card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-card);
    padding:18px 18px 16px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:10px;
    min-height:150px;
    box-shadow:0 1px 2px rgba(38,50,40,0.05);
    opacity:0;
    animation:rise .4s ease forwards;
    transition:transform .12s ease, box-shadow .15s ease;
  }
  .note-card:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 20px rgba(38,50,40,0.10);
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .note-pin{
    position:absolute; top:14px; right:14px;
    color:var(--pin);
    font-size:13px;
  }
  .note-title{
    font-family:'Newsreader',serif;
    font-weight:600;
    font-size:17px;
    line-height:1.3;
    padding-right:16px;
  }
  .note-snippet{
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.5;
    display:-webkit-box;
    -webkit-line-clamp:4;
    -webkit-box-orient:vertical;
    overflow:hidden;
    flex:1;
    white-space:pre-wrap;
  }
  .note-meta{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-top:auto;
  }
  .note-time{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--ink-faint);
  }
  .note-tags{
    display:flex; flex-wrap:wrap; gap:5px;
  }
  .tag-chip{
    background:var(--tag-bg);
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    padding:2px 7px;
    border-radius:20px;
  }

  .empty-state{
    border:1px dashed var(--border);
    border-radius:var(--radius-card);
    padding:44px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
  }
  .empty-state span{ display:block; color:var(--ink-faint); font-size:12.5px; margin-top:6px; }

  /* ---------- Login ---------- */
  .login-screen{
    min-height:100vh; width:100%;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .login-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:42px 36px;
    width:350px; max-width:90vw;
    text-align:center;
    box-shadow:0 12px 28px rgba(38,50,40,0.08);
  }
  .login-title{
    font-family:'Newsreader',serif;
    font-weight:700;
    font-size:26px;
    margin-bottom:8px;
  }
  .login-sub{
    color:var(--ink-soft);
    font-size:13.5px;
    line-height:1.55;
    margin-bottom:28px;
  }
  .google-btn{
    width:100%;
    display:flex; align-items:center; justify-content:center; gap:10px;
    background:#fff; color:#1f1f1f;
    border:1px solid var(--border);
    padding:11px 16px;
    border-radius:9px;
    font-family:'Work Sans',sans-serif;
    font-weight:600; font-size:14px;
    cursor:pointer;
    transition:border-color .15s ease;
  }
  .google-btn:hover{ border-color:var(--accent); }
  .login-error{ margin-top:14px; font-size:12.5px; color:var(--err); display:none; }
  .app-shell{ display:none; width:100%; }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(38,50,40,0.35);
    display:none;
    align-items:center; justify-content:center;
    z-index:50;
    padding:20px;
  }
  .overlay.open{ display:flex; }
  .modal{
    background:var(--surface);
    border-radius:16px;
    padding:26px 28px;
    width:560px; max-width:100%;
    max-height:88vh;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    box-shadow:0 20px 50px rgba(38,50,40,0.18);
  }
  .title-input{
    font-family:'Newsreader',serif;
    font-weight:600;
    font-size:22px;
    border:none;
    outline:none;
    padding:0 0 10px;
    border-bottom:1px solid var(--border);
    margin-bottom:14px;
    background:transparent;
    color:var(--ink);
  }
  .title-input::placeholder{ color:var(--ink-faint); }
  .content-textarea{
    border:none;
    outline:none;
    resize:vertical;
    min-height:180px;
    font-family:'Work Sans',sans-serif;
    font-size:14.5px;
    line-height:1.6;
    color:var(--ink);
    background:transparent;
    margin-bottom:16px;
  }
  .tags-field{
    display:flex; align-items:center; gap:8px;
    margin-bottom:16px;
  }
  .tags-field label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-faint);
    flex-shrink:0;
  }
  .tags-input{
    flex:1;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 11px;
    font-size:13px;
    font-family:inherit;
    outline:none;
    color:var(--ink);
  }
  .tags-input:focus{ border-color:var(--accent); }
  .pin-row{
    display:flex; align-items:center; gap:8px;
    font-size:13px; color:var(--ink-soft);
    margin-bottom:18px;
  }
  .modal-actions{
    display:flex; justify-content:flex-end; gap:10px;
  }
  .btn-secondary{
    background:transparent; border:1px solid var(--border);
    color:var(--ink-soft); padding:9px 16px; border-radius:8px;
    font-size:13.5px; cursor:pointer; font-family:inherit;
  }
  .btn-secondary:hover{ color:var(--ink); border-color:var(--ink-faint); }
  .btn-primary{
    background:var(--accent); border:none; color:#FFF8F0;
    padding:9px 18px; border-radius:8px; font-size:13.5px; font-weight:600;
    cursor:pointer; font-family:'Work Sans',sans-serif;
  }
  .btn-danger-text{
    color:var(--err); background:none; border:none;
    font-size:12.5px; cursor:pointer; padding:0; margin-right:auto;
  }
  .confirm-modal{
    background:var(--surface); border-radius:16px; padding:24px;
    width:320px; max-width:90vw;
  }
  .confirm-title{ font-family:'Newsreader',serif; font-weight:600; font-size:17px; margin-bottom:8px; }
  .confirm-body{ color:var(--ink-soft); font-size:13.5px; line-height:1.5; margin-bottom:20px; }
  .btn-danger{
    background:var(--err); border:none; color:#fff;
    padding:9px 16px; border-radius:8px; font-size:13.5px; font-weight:600;
    cursor:pointer; font-family:'Work Sans',sans-serif;
  }

  @media (max-width:720px){
    body{ flex-direction:column; }
    .sidebar{ width:100%; height:auto; position:static; }
    .tag-list{ flex-direction:row; overflow-x:auto; overflow-y:visible; }
    .main{ padding:22px 18px 50px; }
    .topbar{ flex-wrap:wrap; gap:12px; }
    .new-btn{ flex:1 1 auto; }
    .notes-grid{ grid-template-columns:1fr; }
    .overlay{ align-items:flex-end; padding:0; }
    .modal{ width:100%; max-width:100%; border-radius:16px 16px 0 0; max-height:92vh; }
  }
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-title">Anotações</div>
    <div class="login-sub">Inicia sessão com o Google para veres as tuas notas, privadas e sincronizadas em todos os dispositivos.</div>
    <button class="google-btn" id="googleSignInBtn">
      <svg width="18" height="18" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.91c1.7-1.57 2.69-3.88 2.69-6.64z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.27c-.81.54-1.84.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.33C2.44 15.98 5.48 18 9 18z"/>
        <path fill="#FBBC05" d="M3.96 10.7c-.18-.54-.28-1.11-.28-1.7s.1-1.16.28-1.7V4.97H.96C.35 6.17 0 7.55 0 9s.35 2.83.96 4.03l3-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.97l3 2.33C4.67 5.16 6.66 3.58 9 3.58z"/>
      </svg>
      Continuar com o Google
    </button>
    <div class="login-error" id="loginError">Não foi possível iniciar sessão. Tenta novamente.</div>
  </div>
</div>

<div class="app-shell" id="appShell">
  <aside class="sidebar">
    <div>
      <div class="brand-title">Anotações</div>
      <div class="sync-status"><span class="sync-dot" id="syncDot"></span><span id="syncText">A ligar…</span></div>
    </div>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" id="searchInput" placeholder="Procurar notas...">
    </div>
    <ul class="tag-list" id="tagList"></ul>
    <div class="sidebar-footer">
      <div class="user-row" id="userRow"></div>
      <button class="signout-btn" id="signOutBtn">Terminar sessão</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1 id="viewTitle">Todas as notas</h1>
      <button class="new-btn" id="newNoteBtn">+ Nova nota</button>
    </div>
    <div id="content"></div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <input class="title-input" id="fTitle" placeholder="Título da nota">
    <textarea class="content-textarea" id="fContent" placeholder="Escreve aqui..."></textarea>
    <div class="tags-field">
      <label>tags</label>
      <input class="tags-input" id="fTags" placeholder="separadas por vírgula, ex: receitas, trabalho">
    </div>
    <div class="pin-row">
      <input type="checkbox" id="fPin">
      <label for="fPin" style="margin:0;">Fixar no topo</label>
    </div>
    <div class="modal-actions">
      <button class="btn-danger-text" id="deleteBtn" style="display:none;">Remover</button>
      <button class="btn-secondary" id="cancelBtn">Cancelar</button>
      <button class="btn-primary" id="saveBtn">Guardar</button>
    </div>
  </div>
</div>

<div class="overlay" id="confirmOverlay">
  <div class="confirm-modal">
    <div class="confirm-title">Remover nota?</div>
    <div class="confirm-body">Esta ação não pode ser desfeita.</div>
    <div class="modal-actions">
      <button class="btn-secondary" id="confirmCancelBtn">Cancelar</button>
      <button class="btn-danger" id="confirmOkBtn">Remover</button>
    </div>
  </div>
</div>

<script>
/* ---------- 1) COLA AQUI AS CHAVES DO TEU PROJETO FIREBASE ----------
   1. Cria um projeto em https://console.firebase.google.com
   2. Authentication > Sign-in method > ativa o Google
   3. Firestore Database > cria a base de dados (modo produção)
   4. Em Firestore > Rules, cola:
        rules_version = '2';
        service cloud.firestore {
          match /databases/{database}/documents {
            match /users/{userId}/{document=**} {
              allow read, write: if request.auth != null && request.auth.uid == userId;
            }
          }
        }
   5. Authentication > Settings > Domínios autorizados: adiciona o domínio do GitHub Pages
   6. Definições do projeto > Geral > As tuas apps > copia a config para aqui:
------------------------------------------------------------------------ */
const firebaseConfig = {
  apiKey: "AIzaSyDFKmWT8SZYH2SBefVKCv5VmbzxVRY2Lwk",
  authDomain: "anotacoes-5efca.firebaseapp.com",
  projectId: "anotacoes-5efca",
  storageBucket: "anotacoes-5efca.firebasestorage.app",
  messagingSenderId: "285804529201",
  appId: "1:285804529201:web:4aaf6b22c95924b9c6f710"
};

let fbEnabled = false;
try{
  if(firebaseConfig.apiKey !== "COLA_AQUI"){
    firebase.initializeApp(firebaseConfig);
    fbEnabled = true;
  }
}catch(e){ console.warn('Firebase não configurado corretamente.', e); }

const auth = fbEnabled ? firebase.auth() : null;
const db = fbEnabled ? firebase.firestore() : null;

let currentUser = null;
let notesUnsub = null;
let notes = [];
let activeTag = 'Todas';
let searchQuery = '';
let editingId = null;

function cryptoId(){ return Math.random().toString(36).slice(2, 10); }

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function formatRelative(ts){
  if(!ts) return '';
  const diff = Date.now() - ts;
  const min = Math.floor(diff / 60000);
  if(min < 1) return 'agora mesmo';
  if(min < 60) return `há ${min} min`;
  const hrs = Math.floor(min / 60);
  if(hrs < 24) return `há ${hrs}h`;
  const days = Math.floor(hrs / 24);
  if(days < 7) return `há ${days}d`;
  return new Date(ts).toLocaleDateString('pt-PT', { day:'2-digit', month:'short' });
}

function setSyncStatus(state, text){
  document.getElementById('syncDot').className = 'sync-dot' + (state ? ' ' + state : '');
  document.getElementById('syncText').textContent = text;
}

function showLogin(){
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('appShell').style.display = 'none';
}
function showApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appShell').style.display = 'flex';
}

function renderUserRow(){
  const el = document.getElementById('userRow');
  if(!currentUser){ el.innerHTML = ''; return; }
  el.innerHTML = `
    ${currentUser.photoURL ? `<img src="${currentUser.photoURL}" class="user-avatar">` : ''}
    <span>${escapeHtml(currentUser.displayName || currentUser.email || '')}</span>
  `;
}

function attemptSignIn(){
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(err=>{
    console.error('Erro no login', err);
    errEl.style.display = 'block';
  });
}

function userNotesRef(){
  return db.collection('users').doc(currentUser.uid).collection('notes');
}

function getAllTags(){
  const set = new Set();
  notes.forEach(n => (n.tags || []).forEach(t => set.add(t)));
  return [...set].sort((a,b)=>a.localeCompare(b));
}

function renderTagList(){
  const tags = getAllTags();
  const list = document.getElementById('tagList');
  const items = [{ label:'Todas', count: notes.length }]
    .concat(tags.map(t => ({ label:t, count: notes.filter(n=>(n.tags||[]).includes(t)).length })));
  list.innerHTML = items.map(item => `
    <li class="tag-item ${activeTag===item.label?'active':''}" data-tag="${escapeHtml(item.label)}">
      <span>${escapeHtml(item.label)}</span>
      <span class="tag-count">${item.count}</span>
    </li>
  `).join('');
  list.querySelectorAll('.tag-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      activeTag = el.dataset.tag;
      render();
    });
  });
}

function noteCardHtml(note){
  const snippet = (note.content || '').trim();
  const tags = note.tags || [];
  return `
    <div class="note-card" data-id="${note.id}" style="animation-delay:${Math.random()*0.12}s">
      ${note.pinned ? '<span class="note-pin">★</span>' : ''}
      <div class="note-title">${escapeHtml(note.title || 'Sem título')}</div>
      <div class="note-snippet">${escapeHtml(snippet)}</div>
      <div class="note-meta">
        <span class="note-time">${formatRelative(note.updatedAt)}</span>
        <div class="note-tags">${tags.slice(0,3).map(t=>`<span class="tag-chip">${escapeHtml(t)}</span>`).join('')}</div>
      </div>
    </div>
  `;
}

function render(){
  renderTagList();
  document.getElementById('viewTitle').textContent = activeTag === 'Todas' ? 'Todas as notas' : activeTag;

  const q = searchQuery.trim().toLowerCase();
  let filtered = notes.filter(n=>{
    const matchesTag = activeTag === 'Todas' || (n.tags||[]).includes(activeTag);
    const haystack = `${n.title||''} ${n.content||''} ${(n.tags||[]).join(' ')}`.toLowerCase();
    const matchesQuery = !q || haystack.includes(q);
    return matchesTag && matchesQuery;
  });

  filtered.sort((a,b)=>{
    if(!!b.pinned !== !!a.pinned) return (b.pinned?1:0) - (a.pinned?1:0);
    return (b.updatedAt||0) - (a.updatedAt||0);
  });

  const content = document.getElementById('content');
  if(!filtered.length){
    content.innerHTML = `<div class="empty-state">Sem notas aqui.<span>Experimenta outra pesquisa ou cria uma nota nova.</span></div>`;
    return;
  }
  content.innerHTML = `<div class="notes-grid">${filtered.map(noteCardHtml).join('')}</div>`;
  content.querySelectorAll('.note-card').forEach(card=>{
    card.addEventListener('click', ()=> openModal(card.dataset.id));
  });
}

/* ---------- Modal de edição ---------- */
const overlay = document.getElementById('overlay');

function openModal(id){
  editingId = id || null;
  const note = id ? notes.find(n=>n.id===id) : null;
  document.getElementById('fTitle').value = note ? (note.title||'') : '';
  document.getElementById('fContent').value = note ? (note.content||'') : '';
  document.getElementById('fTags').value = note ? (note.tags||[]).join(', ') : '';
  document.getElementById('fPin').checked = note ? !!note.pinned : false;
  document.getElementById('deleteBtn').style.display = note ? 'block' : 'none';
  overlay.classList.add('open');
  document.getElementById('fTitle').focus();
}
function closeModal(){
  overlay.classList.remove('open');
  editingId = null;
}
document.getElementById('newNoteBtn').addEventListener('click', ()=>openModal(null));
document.getElementById('cancelBtn').addEventListener('click', closeModal);
overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  const title = document.getElementById('fTitle').value.trim();
  const content = document.getElementById('fContent').value.trim();
  const tags = document.getElementById('fTags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const pinned = document.getElementById('fPin').checked;
  if(!title && !content) { closeModal(); return; }

  const now = Date.now();
  setSyncStatus('pending', 'A guardar…');
  try{
    if(editingId){
      await userNotesRef().doc(editingId).set({ title, content, tags, pinned, updatedAt: now }, { merge:true });
    } else {
      await userNotesRef().add({ title, content, tags, pinned, createdAt: now, updatedAt: now });
    }
    setSyncStatus('ok', 'Sincronizado');
  }catch(e){
    console.error('Erro ao guardar nota', e);
    setSyncStatus('err', 'Falha ao guardar');
  }
  closeModal();
});

/* ---------- Confirmação de remoção ---------- */
const confirmOverlay = document.getElementById('confirmOverlay');
document.getElementById('deleteBtn').addEventListener('click', ()=>{
  confirmOverlay.classList.add('open');
});
document.getElementById('confirmCancelBtn').addEventListener('click', ()=>{
  confirmOverlay.classList.remove('open');
});
document.getElementById('confirmOkBtn').addEventListener('click', async ()=>{
  if(editingId){
    setSyncStatus('pending', 'A remover…');
    try{
      await userNotesRef().doc(editingId).delete();
      setSyncStatus('ok', 'Sincronizado');
    }catch(e){
      console.error('Erro ao remover nota', e);
      setSyncStatus('err', 'Falha ao remover');
    }
  }
  confirmOverlay.classList.remove('open');
  closeModal();
});
confirmOverlay.addEventListener('click', (e)=>{ if(e.target===confirmOverlay) confirmOverlay.classList.remove('open'); });

/* ---------- Pesquisa e atalhos de teclado ---------- */
document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchQuery = e.target.value;
  render();
});
document.addEventListener('keydown', (e)=>{
  const tag = (e.target.tagName || '').toLowerCase();
  const isTyping = tag === 'input' || tag === 'textarea';
  if(e.key === 'Escape'){
    if(confirmOverlay.classList.contains('open')) confirmOverlay.classList.remove('open');
    else if(overlay.classList.contains('open')) closeModal();
    return;
  }
  if(e.key === '/' && !isTyping){
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
});

/* ---------- Autenticação e arranque ---------- */
document.getElementById('signOutBtn').addEventListener('click', ()=>{ if(auth) auth.signOut(); });

function init(){
  if(!fbEnabled){
    document.getElementById('content').innerHTML =
      '<div class="empty-state">Firebase por configurar.<span>Edita firebaseConfig no início do ficheiro com as chaves do teu projeto.</span></div>';
    showApp();
    setSyncStatus('err', 'Firebase por configurar');
    return;
  }

  document.getElementById('googleSignInBtn').addEventListener('click', attemptSignIn);

  auth.onAuthStateChanged(user=>{
    currentUser = user;
    if(notesUnsub){ notesUnsub(); notesUnsub = null; }

    if(!user){
      showLogin();
      return;
    }

    showApp();
    renderUserRow();
    setSyncStatus('pending', 'A ligar à base de dados…');

    notesUnsub = userNotesRef().orderBy('updatedAt', 'desc').onSnapshot(
      snap=>{
        notes = snap.docs.map(d => ({ id:d.id, ...d.data() }));
        render();
        setSyncStatus('ok', 'Sincronizado');
      },
      err=>{
        console.error('Erro a sincronizar notas', err);
        setSyncStatus('err', 'Sem ligação à base de dados');
      }
    );
  });
}

init();
</script>
</body>
</html>
